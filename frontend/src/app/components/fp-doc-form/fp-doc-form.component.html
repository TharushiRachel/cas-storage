<div class="container">
  <div class="header">
    <h2>{{ isEditMode ? 'Edit' : 'Add' }} FP Document Authorization</h2>
    <a routerLink="/" class="btn btn-secondary">Back to List</a>
  </div>

  <div *ngIf="loading" class="loading">
    Loading...
  </div>

  <div *ngIf="errorMessage" class="error-alert">
    {{ errorMessage }}
  </div>

  <form *ngIf="!loading" [formGroup]="docForm" (ngSubmit)="onSubmit()" class="form-card">
    <div class="form-row">
      <div class="form-group">
        <label for="facilityPaperId">Facility Paper ID *</label>
        <input type="number" id="facilityPaperId" formControlName="facilityPaperId" class="form-control" 
               [ngClass]="{'is-invalid': docForm.get('facilityPaperId')?.invalid && docForm.get('facilityPaperId')?.touched}">
        <div class="invalid-feedback" *ngIf="docForm.get('facilityPaperId')?.invalid && docForm.get('facilityPaperId')?.touched">
          Facility Paper ID is required
        </div>
      </div>

      <div class="form-group">
        <label for="fpDocId">FP Document ID *</label>
        <input type="number" id="fpDocId" formControlName="fpDocId" class="form-control"
               [ngClass]="{'is-invalid': docForm.get('fpDocId')?.invalid && docForm.get('fpDocId')?.touched}">
        <div class="invalid-feedback" *ngIf="docForm.get('fpDocId')?.invalid && docForm.get('fpDocId')?.touched">
          FP Document ID is required
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="addedBy">Added By</label>
        <input type="text" id="addedBy" formControlName="addedBy" class="form-control">
      </div>

      <div class="form-group">
        <label for="currentAssignUser">Current Assign User</label>
        <input type="text" id="currentAssignUser" formControlName="currentAssignUser" class="form-control">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="verifiedBy">Verified By</label>
        <input type="text" id="verifiedBy" formControlName="verifiedBy" class="form-control">
      </div>

      <div class="form-group">
        <label for="authorizedBy">Authorized By</label>
        <input type="text" id="authorizedBy" formControlName="authorizedBy" class="form-control">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" formControlName="isAdded" 
                 [checked]="docForm.get('isAdded')?.value === 'Y'" 
                 (change)="docForm.get('isAdded')?.setValue($any($event.target).checked ? 'Y' : 'N')">
          Is Added
        </label>
      </div>

      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" formControlName="isVerified" 
                 [checked]="docForm.get('isVerified')?.value === 'Y'" 
                 (change)="docForm.get('isVerified')?.setValue($any($event.target).checked ? 'Y' : 'N')">
          Is Verified
        </label>
      </div>

      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" formControlName="isAuthorized" 
                 [checked]="docForm.get('isAuthorized')?.value === 'Y'" 
                 (change)="docForm.get('isAuthorized')?.setValue($any($event.target).checked ? 'Y' : 'N')">
          Is Authorized
        </label>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="submitting">
        {{ submitting ? 'Saving...' : 'Save' }}
      </button>
      <button type="button" routerLink="/" class="btn btn-secondary ml-2">Cancel</button>
    </div>
  </form>
</div>
