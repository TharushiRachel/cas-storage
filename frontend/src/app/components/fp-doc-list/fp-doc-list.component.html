<div class="container">
  <div class="header">
    <h2>FP Document Authorizations</h2>
    <a routerLink="/add" class="btn btn-primary">Add New</a>
  </div>

  <div *ngIf="loading" class="loading">
    Loading...
  </div>

  <table *ngIf="!loading" class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Facility Paper ID</th>
        <th>FP Doc ID</th>
        <th>Added By</th>
        <th>Verified By</th>
        <th>Authorized By</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let doc of docs">
        <td>{{ doc.id }}</td>
        <td>{{ doc.facilityPaperId }}</td>
        <td>{{ doc.fpDocId }}</td>
        <td>{{ doc.addedBy }}</td>
        <td>{{ doc.verifiedBy }}</td>
        <td>{{ doc.authorizedBy }}</td>
        <td>
          <a [routerLink]="['/edit', doc.id]" class="btn btn-sm btn-info">Edit</a>
        </td>
      </tr>
      <tr *ngIf="docs.length === 0">
        <td colspan="7" class="text-center">No records found.</td>
      </tr>
    </tbody>
  </table>
</div>
